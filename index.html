<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Granja Sintani, SARL - Qualidade Local, Futuro Sustentável</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-green: #0a5c36;
      --accent-gold: #e5a93c;
    }
    @keyframes slideIn {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast-anim {
      animation: slideIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased pb-24">

  <!-- NOTIFICAÇÃO DE SUCESSO (TOAST NOTIFICATION) -->
  <div id="toast-notification" class="fixed top-5 right-5 z-50 bg-emerald-800 text-white px-5 py-3.5 rounded-2xl shadow-2xl border-2 border-amber-400 flex items-center gap-3 hidden toast-anim">
    <div class="bg-amber-400 text-emerald-950 p-2 rounded-xl text-lg font-black">
      <i class="fas fa-check-circle"></i>
    </div>
    <div>
      <h5 class="font-bold text-sm leading-tight text-white">Item Adicionado!</h5>
      <p id="toast-message" class="text-xs text-emerald-200">Produto adicionado ao carrinho com sucesso.</p>
    </div>
  </div>

  <!-- Header / Navegação -->
  <header class="sticky top-0 z-40 bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Logótipo Local -->
        <img src="logo.jpg" alt="Granja Sintani, SARL Logo" class="h-14 w-auto object-contain rounded-lg border border-emerald-100 shadow-sm">
